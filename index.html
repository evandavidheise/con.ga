<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>con.ga - Animated Logo</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            cyan: '#00f0ff',
                            pink: '#ff007f',
                            purple: '#7000ff',
                            dark: '#050508',
                        }
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-12px) rotate(0.5deg)' },
                        },
                        pulseGlow: {
                            '0%': { filter: 'drop-shadow(0 0 15px rgba(0, 240, 255, 0.4)) drop-shadow(0 0 35px rgba(112, 0, 255, 0.2))' },
                            '100%': { filter: 'drop-shadow(0 0 25px rgba(255, 0, 127, 0.6)) drop-shadow(0 0 50px rgba(0, 240, 255, 0.4))' }
                        },
                        scanline: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(1000%)' }
                        }
                    },
                    animation: {
                        'float-slow': 'float 6s ease-in-out infinite',
                        'glow-pulse': 'pulseGlow 3s ease-in-out infinite alternate',
                        'scan': 'scanline 4s linear infinite',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600&family=JetBrains+Mono:ital,wght@0,300;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030305;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
        .radial-gradient-bg {
            background: radial-gradient(circle at 50% 50%, rgba(18, 18, 30, 0.8) 0%, rgba(3, 3, 5, 0.95) 70%, #030305 100%);
        }
        .logo-text {
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.04em;
        }
        .cyber-grid {
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="radial-gradient-bg cyber-grid relative selection:bg-cyber-pink selection:text-white">

    <canvas id="particleCanvas"></canvas>

    <main class="relative z-10 flex flex-col items-center justify-center text-center px-4 select-none">
        
        <!-- Ambient Backlight Glow -->
        <div class="absolute w-72 h-72 sm:w-96 sm:h-96 bg-gradient-to-tr from-cyber-cyan/20 via-cyber-purple/20 to-cyber-pink/20 rounded-full blur-3xl opacity-60 animate-pulse pointer-events-none"></div>

        <!-- Interactive Logo Container -->
        <div id="logoContainer" class="relative cursor-pointer group py-10 px-6">
            
            <!-- Floating Holographic Badge -->
            <div class="absolute -top-6 left-1/2 transform -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
            </div>

            <!-- Main Animated Typography Logo -->
            <h1 class="logo-text text-6xl sm:text-8xl md:text-9xl font-black text-white animate-float-slow animate-glow-pulse transition-transform duration-300 group-hover:scale-105">
                con<span class="text-cyber-cyan transition-colors duration-300 group-hover:text-white">.</span><span class="text-cyber-pink drop-shadow-[0_0_25px_rgba(255,0,127,0.7)]">ga</span>
            </h1>

            <!-- Sub-caption / Status text -->
            <div class="mt-6 flex items-center justify-center space-x-3 text-xs sm:text-sm font-mono tracking-widest text-gray-400 group-hover:text-cyber-cyan transition-colors duration-300">
                <span class="w-2 h-2 rounded-full bg-cyber-pink animate-ping"></span>
                <span class="w-2 h-2 rounded-full bg-cyber-cyan animate-pulse"></span>
            </div>
        </div>

    </main>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        class MatrixParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.8 + 0.5;
                this.speedY = (Math.random() - 0.5) * 0.3 - 0.2; // slight upward drift
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.6 + 0.1;
                this.color = Math.random() > 0.3 ? '#00f0ff' : '#ff007f';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                // Mouse interaction / repulsion
                if (mouse.active) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        let force = (120 - dist) / 120;
                        this.x -= (dx / dist) * force * 2;
                        this.y -= (dy / dist) * force * 2;
                    }
                }

                if (this.y < 0 || this.y > height || this.x < 0 || this.x > width) {
                    this.reset();
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const particleCount = Math.min((window.innerWidth * window.innerHeight) / 12000, 100);
        for (let i = 0; i < particleCount; i++) {
            particles.push(new MatrixParticle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Interactive subtle pulse effect on click
        const logoContainer = document.getElementById('logoContainer');
        logoContainer.addEventListener('click', () => {
            logoContainer.style.transform = 'scale(0.97)';
            setTimeout(() => {
                logoContainer.style.transform = 'scale(1)';
            }, 150);
        });
    </script>
</body>
</html>
