<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>con.ga/minus</title>
  <style>
    :root {
      --bg: #12131C;
      --surface: #1B1D2A;
      --raised: #232638;
      --line: #2C3045;
      --text: #ECEEF8;
      --mute: #8A90AB;
      --accent: #8C9BFF;
      --warm: #FF8F70;
      --ok: #5EE0B0;
      --amber: #F5C26B;
      --r: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 14px 28px;
      background: rgba(18, 19, 28, 0.88);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-right: auto;
    }
    .mark {
      width: 28px;
      height: 28px;
      border-radius: 99px;
      background: var(--accent);
      display: grid;
      place-items: center;
    }
    .mark::after {
      content: "";
      width: 14px;
      height: 3px;
      border-radius: 2px;
      background: var(--bg);
    }
    .dev { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--mute); }
    select, button { font: inherit; color: var(--text); }
    select {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 180px;
      max-width: 240px;
    }
    button { cursor: pointer; }
    .ghost { background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
    .ghost:hover, .seg button:hover { background: var(--raised); }
    #gateInfo.open { color: var(--ok); }
    .load { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
    .load .bar { width: 72px; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
    #dsp-fill { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
    .load b { color: var(--text); font-weight: 600; min-width: 42px; }
    .go { background: var(--accent); color: #12131C; border: 0; border-radius: 999px; padding: 10px 26px; font-weight: 700; }
    .go.live { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--warm); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 48px; display: grid; gap: 24px; }
    .panel, .chs { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
    .ph, .ch-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    h2 { margin: 0; font-size: 15px; font-weight: 650; }
    #selName, #count { color: var(--mute); font-weight: 500; }
    .legend { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--mute); }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    #spectrum { width: 100%; height: 190px; display: block; background: var(--bg); border-radius: 12px; }
    .ch-h #count { margin-right: auto; }
    .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { background: none; border: 0; padding: 7px 14px; font-size: 13px; }
    .seg button.act { background: var(--raised); color: var(--accent); }
    .seg button + button { border-left: 1px solid var(--line); }
    #strips { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; }
    .empty { grid-column: 1 / -1; margin: 24px 0; color: var(--mute); text-align: center; }
    .strip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 10px 6px 12px;
      background: var(--raised);
      border: 1px solid transparent;
      border-radius: 14px;
      transition: opacity .2s, border-color .2s;
    }
    .strip:not(.enabled) { opacity: .5; }
    .strip.sel { border-color: var(--accent); }
    .strip small { font-size: 11px; color: var(--mute); }
    .strip.enabled small { color: var(--accent); }
    .n { background: none; border: 0; font-weight: 650; font-size: 13px; padding: 2px 4px; border-radius: 6px; }
    .vm { display: flex; gap: 5px; height: 120px; }
    .t { position: relative; width: 8px; border-radius: 4px; background: var(--bg); overflow: hidden; }
    .t i { position: absolute; inset: 0; transform: scaleY(0); will-change: transform; }
    .t.in i { background: var(--accent); transform-origin: bottom; }
    .t.gr i { background: var(--warm); transform-origin: top; }
    .sw { position: relative; width: 42px; height: 24px; border-radius: 999px; border: 0; background: var(--line); transition: background .2s; }
    .sw span { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .sw[aria-checked="true"] { background: var(--accent); }
    .sw[aria-checked="true"] span { transform: translateX(18px); }
    details { color: var(--mute); font-size: 12px; }
    summary { cursor: pointer; margin-bottom: 8px; }
    #log {
      max-height: 140px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
    }
    @media(prefers-reduced-motion: reduce) { * { transition: none !important; } }
    @media(max-width: 640px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      select { min-width: 0; width: 100%; max-width: none; }
      .dev, label { width: 100%; }
    }

    .hw { font-size: 11px; color: var(--mute); max-width: 360px; }
    .hw.warn { color: var(--amber); }
    #learnInfo.on { color: var(--accent); }
    .strip.shed { border-color: var(--amber); }
    .guard { color: var(--mute); font-size: 11px; }
    .guard.act { color: var(--amber); }
    #blocker { display: none; }
    .blocked header, .blocked main { display: none; }
    .blocked #blocker { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    #blocker .card { max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; text-align: center; }
    #blocker h1 { margin: 0 0 10px; font-size: 20px; }
    #blocker p { margin: 0; color: var(--mute); }
  </style>
</head>
<body>
  <div id="blocker" role="alert"><div class="card"><h1 id="blockTitle"></h1><p id="blockMsg"></p></div></div>
  <header>
    <div class="brand"><span class="mark"></span>con.ga/minus</div>
    <div class="dev">
      <label>Mixer input<select id="selIn"></select></label>
      <label>Return to mixer<select id="selOut"></select></label>
      <button id="btnScan" class="ghost">Scan devices</button>
      <button id="btnGuard" style="display: none;" class="ghost" title="Automatically freezes parts of the DSP when the audio thread nears overload">Load guard: On</button>
    </div>
    <div class="load">DSP <div class="bar"><i id="dsp-fill"></i></div><b id="dsp-val">0.0%</b><span id="guardInfo" class="guard"></span></div>
    <div class="hw" id="hwInfo"></div>
    <div class="seg" role="group" aria-label="Output source" style="display:none;">
      <button id="btnMask" class="act" title="Raw audio shaped by the predicted mask">Raw + mask</button>
      <button id="btnLegacy" title="Original processed chain">Legacy</button>
    </div>
    <button id="btnStart" class="go">Start</button>
  </header>

  <main>
    <section class="panel">
      <div class="ph">
        <h2>Signal <span id="selName">Ch 1</span> <span id="lagInfo" style="font-size:12px;color:var(--mute);font-weight:400"></span> <span id="gateInfo" style="font-size:12px;color:var(--mute);font-weight:400"></span> <span id="learnInfo" style="font-size:12px;color:var(--mute);font-weight:400"></span></h2>
        <div class="legend">
          <span><i style="background:#8A90AB"></i>Input</span>
          <span><i style="background:#8C9BFF"></i>Clean</span>
          <span><i style="background:#FF8F70"></i>Removed</span>
        </div>
      </div>
      <canvas id="spectrum"></canvas>
    </section>

    <section class="chs">
      <div class="ch-h">
        <h2>Channels</h2><span id="count"></span>
        <div class="seg"><button id="btnAll">Process all</button><button id="btnNone">Bypass all</button></div>
      </div>
      <div id="strips"><p class="empty">Connect your mixer over USB, choose it above, then press Start.</p></div>
    </section>

    <details><summary>Activity log</summary><div id="log"></div></details>
  </main>

  <script>
    let rawAudioCtx, rawStream, rawSource;

    const defaultConfig = {
      optAEC: true,
      optNS: true,
      optAGC: false,
      bufSize: 'interactive',
      fftMode: 'dual',
      cascadePasses: 0,
      rawProcessedBlend: 0,
      blendRatio: 0.5,
      finalMaskBlend: 1,
      predictAmount: 0.6,
      sensitivity: 0,        
      bodySaver: 100,        
      maskSmooth: 80,        
      maxCut: 0,             
      strength: 0,           
      confirmMs: 0,          // <--- SET TO 0: Opens the gate instantly without waiting for signal confirmation
      overallGainDb: 0,
      inputTrimDb: -9,       
      baseNoise: 0,          
      transientNoiseBoost: 0,
      parallelBody: 0,
      transientProtect: 100, // <--- SET TO 100: Protects high-frequency consonant attacks from noise reduction mask
      harmonics: 0,          
      syntheticSub: 0,       
      bottomBlend: 0,
      vocalMaskIterations: 1,
      vocalMaskBlend: 0,
      sampleRate: 48000,     
      finalGate: true,       
      gateOpenDb: 2,
      lookaheadMs: 5         // audio is delayed this much so the gate/denoise decide BEFORE the consonant arrives
    };

    const workletCode = `
    const FFTS = {};
    function getFFT(n) {
      if (FFTS[n]) return FFTS[n];
      const rev = new Uint16Array(n), cs = new Float64Array(n / 2), sn = new Float64Array(n / 2), lg = Math.log2(n);
      for (let i = 0; i < n; i++) { let j = 0; for (let b = 0; b < lg; b++) j = (j << 1) | ((i >> b) & 1); rev[i] = j; }
      for (let i = 0; i < n / 2; i++) { cs[i] = Math.cos(2 * Math.PI * i / n); sn[i] = Math.sin(2 * Math.PI * i / n); }
      return FFTS[n] = {
        n, re: new Float64Array(n), im: new Float64Array(n), xr: new Float64Array(n), xi: new Float64Array(n),
        fwd(re, im) {
          for (let i = 0; i < n; i++) { const j = rev[i]; if (j > i) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
          for (let size = 2; size <= n; size <<= 1) {
            const half = size >> 1, step = n / size;
            for (let i = 0; i < n; i += size) {
              for (let j = i, k = 0; j < i + half; j++, k += step) {
                const wr = cs[k], wi = -sn[k], xr = re[j + half], xi = im[j + half];
                const tr = xr * wr - xi * wi, ti = xr * wi + xi * wr;
                re[j + half] = re[j] - tr; im[j + half] = im[j] - ti; re[j] += tr; im[j] += ti;
              }
            }
          }
        },
        inv(re, im) {
          for (let i = 0; i < n; i++) im[i] = -im[i];
          this.fwd(re, im);
          const s = 1 / n;
          for (let i = 0; i < n; i++) { re[i] *= s; im[i] = -im[i] * s; }
        }
      };
    }
    const hann = n => { const w = new Float32Array(n); for (let i = 0; i < n; i++) w[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * (i + 0.5) / n); return w; };
    const N = 512, HOP = 256, K = N / 2 + 1, L = 128, ND = 2 * L, KD = ND / 2 + 1, RB = 8192, RM = RB - 1, LN = 4096, DMAX = 2000, NB = 96;
    const WIN = hann(N), WLN = hann(LN);
    const GATE_OPEN = 0.003, GATE_CLOSE = 0.0015; 
    const LA = 64, LB = 128, LD = 64, LG = 128;
    const NS = 128, KS = NS / 2 + 1, WS = (() => {
      const w = new Float32Array(NS), T = 16, R = NS - T;
      for (let i = 0; i < NS; i++) w[i] = i < R ? Math.pow(Math.sin(Math.PI / 2 * (i + .5) / R), 2) : Math.pow(Math.cos(Math.PI / 2 * (i - R + .5) / T), 2);
      return w;
    })();

    class MFProcessor extends AudioWorkletProcessor {
      constructor(opts) {
        super();
        const o = opts.processorOptions || {};
        this.idx = o.index || 0;
        this.cfg = { inputTrim: Math.pow(10, -9 / 20), overallGainLinear: 1.0, blend: 1, predict: 0.6, floorDb: -40, ceilDb: 12, smooth: 50, wl: 1 };
        this.env = 0; this.sg = 1; this.hp = 0; this.hpo = 0;
        this.rr = new Float32Array(RB); this.pp = new Float32Array(RB); this.wp = 0; this.filled = 0;
        this.lag = 0; this.conf = 0; this.dep = 0; this.cand = 0; this.cn = 0; this.qn = 0; this.nextLag = 20 + (this.idx * 7) % 60;
        this.qp = new Float32Array(8); this.qi = 0; this.sw = 0; this.g = 1; this.bl = 1; this.ready = false; this.wlAct = false; this.wlPrev = false; this.updateSmooth();
        this.t1 = new Float32Array(K); this.hist = null; this.pb = new Float32Array(128);
        this.sendStats = false; this.hops = 0; this.frameCount = 0; this.smoothedCpuLoad = 0; this.cpuDt = 0; this.cpuQ = 0; this.shed = 0; this.shedEff = 0; this.heavyCool = 0; this.frz = 0; this.dnMix = 1; this.gSk = 0;
        
        this.maskMemoryBuf = new Float32Array(K);
        this.zeroLatencyPassState = 0;
        this.lg = 1; this.lgT = 1; this.lgA = 1; this.lgHold = 0;
        this.lgAtk = 1 - Math.exp(-1 / (0.008 * sampleRate)); this.lgRel = 1 - Math.exp(-1 / (0.35 * sampleRate));
        this.oFast = 0; this.oSlow = 0; this.inSlow = 0; this.loud = 0; this.crestN = 0; this.growAny = false; this.rbPrev = 0; this.rClean = null;

        this.feedbackHoldTimer = 0;
        this.gateEnvelope = 1.0;
        this.gateThresh = 0.002; this.gateLvl = 0; this.gateDec = Math.exp(-1 / (0.030 * sampleRate));
        this.gateAtk = 1 - Math.exp(-1 / (0.0008 * sampleRate));
        this.gateRel = 1 - Math.exp(-1 / (0.120 * sampleRate));

        this.preGateEnv = 1.0;
        this.postGateEnv = 1.0;

        // Fader ride (per channel): lgT is the ridden fader (linear). Drops hard on extreme feedback, then slowly probes back up.
        this.frOn = true; this.frMin = Math.pow(10, -36 / 20); this.frAcc = 0; this.frSafe = 1; this.frKnown = false; this.frStart = 1; this.frXd = false; this.frQuiet = 0; this.frWait = 0.6; this.frRawHold = 0; this.frEp = false; this.frCeilT = 0; this.frLastDb = 0; this.frState = 0;
        this.fgEnabled = true; this.fgOpenR = Math.pow(10, 0.3); this.fg = 1; this.fgLast = true;
        this.fgAtk = 1 - Math.exp(-1 / (0.0015 * sampleRate)); this.fgRel = 1 - Math.exp(-1 / (0.120 * sampleRate));
        this.initMask();
        this.initPost(); this.updatePostSmooth();
        this.port.onmessage = (e) => {
          if (e.data.type === 'config') {
            const d = e.data;
            if ('inputTrimDb' in d) this.cfg.inputTrim = Math.pow(10, d.inputTrimDb / 20);
            if ('overallGainDb' in d) this.cfg.overallGainLinear = Math.pow(10, d.overallGainDb / 20);
            if ('finalMaskBlend' in d) this.cfg.blend = d.finalMaskBlend;
            if ('predictAmount' in d) this.cfg.predict = d.predictAmount;
            if ('maskSmooth' in d) { this.cfg.smooth = d.maskSmooth; this.updateSmooth(); }
            if ('transientProtect' in d) this.cfg.wl = Math.max(0, Math.min(1, d.transientProtect / 100));
            if ('finalGate' in d) this.fgEnabled = !!d.finalGate;
            if ('gateOpenDb' in d) this.fgOpenR = Math.pow(10, Math.max(0, d.gateOpenDb) / 10);
            if ('lookaheadMs' in d) this.laD = Math.max(0, Math.min(4000, Math.round(d.lookaheadMs * 0.001 * sampleRate)));
          } else if (e.data.type === 'shed') { this.shed = e.data.level | 0; } else if (e.data.type === 'sel') {
            this.sendStats = !!e.data.value;
            if (this.sendStats) this.port.postMessage({ type: 'gate', open: this.fgHold > 0, noise: this.fgNoiseCnt >= 20 });
          }
        };
      }
      initMask() {
        this.Srr = new Float32Array(K); this.Spp = new Float32Array(K); this.L1 = new Float32Array(K); this.vel = new Float32Array(K);
        this.Lhi = new Float32Array(K); this.Lsh = new Float32Array(K); this.Lap = new Float32Array(K);
        this.hs = new Float32Array(L); this.ht = new Float32Array(L); this.hs[L - 1] = 1; this.ht[L - 1] = 1;
        this.Lpr = new Float32Array(K); this.Lsm = new Float32Array(K); this.Lfin = new Float32Array(K); this.Wf = new Float32Array(K);
        this.Wc = new Float32Array(KS); this.Pb = new Float32Array(KS); this.St = new Float32Array(KS); this.Pw = new Float32Array(KS); this.T2 = new Float32Array(KS);
        this.lnGp = 0; this.lnGh = 0; if (this.hist) this.hist.fill(0);
      }
      updateSmooth() {
        const sm = this.cfg.smooth, hopMs = 2 * 128 / sampleRate * 1000, tA = 1 + 0.05 * sm, tR = 3 + 0.20 * sm;
        this.cA = 1 - Math.exp(-hopMs / tA); this.cR = 1 - Math.exp(-hopMs / tR);
        this.slA = 1.0; this.slR = 0.5 - 0.3 * (sm / 100);
        this.coefSlew = 0.55 - 0.25 * (sm / 100);
        this.gAtk = 1 - Math.exp(-1 / (0.002 * sampleRate));
        this.gRel = 1 - Math.exp(-1 / ((0.008 + 0.00008 * sm) * sampleRate));
      }
      initPost() {
        this.PN = 512; this.PK = this.PN / 2 + 1; this.PW = hann(this.PN); this.PS = (this.PN / 512) * (this.PN / 512);
        this.holdHops = Math.max(8, Math.round(0.13 * sampleRate / 256));
        const PK = this.PK;
        this.pSr = new Float32Array(PK); this.pSo = new Float32Array(PK); this.pSa = new Float32Array(PK);
        this.La = new Float32Array(PK); this.Lb = new Float32Array(PK); this.tA = new Float32Array(PK); this.tB = new Float32Array(PK); this.tS = new Float32Array(PK);
        this.haS = new Float32Array(LA); this.haT = new Float32Array(LA); this.hbS = new Float32Array(LB); this.hbT = new Float32Array(LB);
        this.haS[LA - 1] = this.haT[LA - 1] = 1; this.hbS[LB - 1] = this.hbT[LB - 1] = 1;
        this.rw = new Float32Array(RB); this.oo = new Float32Array(RB); this.aa = new Float32Array(RB);
        this.HR = null; this.HO = null; this.HD = null; this.rcB = new Float32Array(128);
        this.hbO = new Float32Array(LB); this.hbD = new Float32Array(LB);
        this.fbPrev = new Float32Array(PK); this.fbAge = new Float32Array(PK); this.tF = new Float32Array(PK); this.tG = new Float32Array(PK); this.Fb = new Float32Array(PK); this.fbGrow = new Uint8Array(PK);
        this.gHold = 0; this.g1 = 1; this.g2 = 1; this.vr = 0; this.tonalDom = false; this.fbEnv = 0;
        this.gAtkB = 1 - Math.exp(-1 / (0.0025 * sampleRate)); this.gRelB = 1 - Math.exp(-1 / (0.045 * sampleRate));
        this.tSs = new Float32Array(PK); this.Nn = new Float32Array(PK); this.Nb = new Float32Array(PK); this.Ld = new Float32Array(PK); this.tD = new Float32Array(PK); this.tD2 = new Float32Array(PK);
        this.dnS = new Float32Array(LD); this.dnT = new Float32Array(LD); this.dnO = new Float32Array(LD); this.dnD = new Float32Array(LD);
        this.dnS[LD - 1] = this.dnT[LD - 1] = 1; this.nzAge = 0; this.nzQuiet = 0; this.nzReady = false; this.lfAge = 0; this.openAge = 0; this.openLen = Math.round(0.015 * sampleRate);
        this.flb = new Uint8Array(PK); this.ringCut = new Uint8Array(PK); this.fgR = new Float32Array(PK); this.fgS = new Float32Array(PK);
        this.initGate();
        this.dnMix2 = 0; this.fgHold = 0; this.fgHoldHops = Math.max(8, Math.round(0.40 * sampleRate / 256)); this.fgOn = false; this.fgNoiseCnt = 0; this.nzMaxAge = Math.max(32, Math.round(1.0 * sampleRate / 256)); this.gAge = 0; this.fgSnr = 0; this.fgEnv = 1;
        this.stM = 0; this.stD = 0; this.stInit = false; this.statCnt = 0; this.ambientNow = false; this.statNeed = Math.max(60, Math.round(4.0 * sampleRate / 256)); this.stC = 1 - Math.exp(-(256 / sampleRate) / 0.5);
        this.vcBuf = new Float32Array(512); this.pkFrac = 0; this.voiced = 0; this.vcCnt = 0; this.vcRc = new Float32Array(200);
        this.fbLeak = false; this.fbLeakCnt = 0; this.fgAct = 0; this.fgGentle = 0; this.fgHoldVoc = Math.max(16, Math.round(0.50 * sampleRate / 256)); this.fgHoldMin = Math.max(6, Math.round(0.06 * sampleRate / 256));
        this.gentleVoc = Math.max(8, Math.round(0.12 * sampleRate / 256)); this.gentleNo = Math.max(4, Math.round(0.08 * sampleRate / 256)); this.provHops = Math.max(4, Math.round(0.04 * sampleRate / 256));
        this.oe = 0; this.nf = 0; this.oeA = 1 - Math.exp(-1 / (0.001 * sampleRate)); this.oeR = 1 - Math.exp(-1 / (0.010 * sampleRate)); this.nfU = 1 - Math.exp(-1 / (0.5 * sampleRate)); this.nfD = 1 - Math.exp(-1 / (0.010 * sampleRate));
      }
      initGate() {

        if (!el.options.length) { const o = document.createElement('option'); o.value = ''; o.textContent = 'System default'; el.appendChild(o); }
        if (had && [...el.options].some(o => o.value === had)) el.value = had;
      };
      fill($('selIn'), 'audioinput', hadIn);
      fill($('selOut'), 'audiooutput', hadOut);
      if (!hadIn) {
        const hit = [...$('selIn').options].find(o => /x32|xr18|x-air|m32|wing|behringer|allen|a&h|sq-|qu-|dlive/i.test(o.textContent));
        if (hit) $('selIn').value = hit.value;
        matchOut();
      }
    }

    function matchOut() {
      const i = devs.find(d => d.kind === 'audioinput' && d.deviceId === $('selIn').value);
      const o = i && devs.find(d => d.kind === 'audiooutput' && d.groupId === i.groupId);
      if (o) $('selOut').value = o.deviceId;
    }

    /* ------------------------------------------------------------------
       Channel routing: processed <-> direct bypass
    ------------------------------------------------------------------ */
    function ramp(param, target, ms) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      try {
        param.cancelScheduledValues(t);
        param.setValueAtTime(param.value, t);
        param.linearRampToValueAtTime(target, t + ms / 1000);
      } catch (e) {}
    }

    function applyCh(i, on) {
      if (!audioCtx || !gP[i]) return;
      clearTimeout(tm[i]); clearTimeout(warmT[i]);
      on = !!on && !shedCh.includes(i);
      if (on) {
        let warm = 0;
        if (!wired[i]) { wn[i].connect(gP[i]); wired[i] = true; warm = WARMUP_MS; }
        const go = () => { ramp(gP[i].gain, mkLin, XFADE_MS); ramp(gB[i].gain, 0, XFADE_MS); };
        if (warm) warmT[i] = setTimeout(go, warm); else go();   // bypass keeps playing while the DSP warms up
      } else {
        ramp(gP[i].gain, 0, XFADE_MS); ramp(gB[i].gain, 1, XFADE_MS);
        tm[i] = setTimeout(() => {
          if (!effOn(i) && wired[i]) { try { wn[i].disconnect(); } catch (e) {} wired[i] = false; load[i] = 0; }
        }, XFADE_MS + 100);
      }
    }

    /* ---- Load guard: freezes DSP stages progressively, then bypasses channels, to prevent underruns ----
       Stage 1: freeze delay tracking, feedback analysis at 1/4 rate
       Stage 2: + feedback analysis 1/8, mask update 1/4, transient detect 1/2, gate analysis 1/2
       Stage 3: freeze everything but the fixed feedback filter; gate/denoise fade out, gate fails open
       Underrun -> jump straight to stage 3. Each channel also self-freezes for ~64 ms after any slow block,
       and channels are phase-staggered so their heavy work never lands in the same audio block.
       Then: whole channels move to the direct bypass path, last channel first          */
    function sendShed() { wn.forEach(w => w.port.postMessage({ type: 'shed', level: shedStage })); }
    function updateShedUI() {
      document.querySelectorAll('.strip').forEach((s, i) => { const on = shedCh.includes(i); s.classList.toggle('shed', on); s.title = on ? 'Temporarily bypassed by load guard' : ''; });
      const parts = [];
      if (shedStage) parts.push('stage ' + shedStage);
      if (shedCh.length) parts.push(shedCh.length + ' ch bypassed');
      setTxt('guardInfo', parts.length ? 'Guard: ' + parts.join(', ') : (guardOn ? '' : 'Guard off'), 'guard' + (parts.length ? ' act' : ''));
    }
    function raiseShed(avg, under) {
      const now = performance.now();
      const tag = 'DSP ' + (avg * 100).toFixed(0) + '%' + (under > 0 ? ', underrun' : '');
      if (now - lastLower < 15000) lowerBlockUntil = now + 60000;   // lowering caused overload: stay down for a minute
      if (shedStage < 3) { shedStage++; sendShed(); log('Load guard: freezing stage ' + shedStage + ' (' + tag + ')'); }
      else {
        let pick = -1;
        for (let i = wn.length - 1; i >= 0; i--) if (effOn(i) && i !== sel) { pick = i; break; }
        if (pick < 0 && effOn(sel)) pick = sel;
        if (pick < 0) return;
        shedCh.push(pick); applyCh(pick, true);
        log('Load guard: Ch ' + (pick + 1) + ' moved to direct bypass (' + tag + ')');
      }
      updateShedUI();
    }
    function canLower(avg) {
      if (performance.now() < lowerBlockUntil) return false;
      if (shedCh.length) { const act = Math.max(1, wired.filter(Boolean).length); return avg + avg / act < GOV.hi * 0.85; }
      if (shedStage > 0) return avg * STAGE_COST[shedStage] < GOV.hi * 0.85;     // only step down if the result is predicted safe
      return false;
    }
    function lowerShed() {
      if (shedCh.length) { const i = shedCh.pop(); applyCh(i, enabledMask[i]); log('Load guard: Ch ' + (i + 1) + ' processing restored'); }
      else if (shedStage > 0) { shedStage--; sendShed(); log('Load guard: back to stage ' + shedStage); }
      updateShedUI();
    }
    function govern(avg, peak, under) {
      if (!guardOn || !running) return;
      const now = performance.now();
      if (under > 0) {                                   // underrun = clicks happening now: freeze hard, immediately
        calmSince = 0; overSince = 0;
        underTimes.push(now); underTimes = underTimes.filter(t => now - t < 10000);
        if (now - lastRaise > GOV.panicGapMs) {
          if (shedStage < 3) { const was = shedStage; shedStage = 3; sendShed(); log('Load guard: PANIC freeze, stage ' + was + ' to 3 (underrun)'); updateShedUI(); }
          else raiseShed(avg, under);
          lastRaise = now;
        }
        if (underTimes.length >= 4 && shedStage >= 3 && hintLevel < HINTS.length - 1 && now - lastHintBump > 15000) {
          hintLevel++; lastHintBump = now;
          log('Load guard: still underrunning at maximum freeze, enlarging audio buffer (' + HINTS[hintLevel] + ')');
          scheduleRestart('larger audio buffer for stability');
        }
        return;
      }
      const over = avg > GOV.hi || (peak >= 0.95 && avg > GOV.peakAvg);
      if (over) {
        calmSince = 0; if (!overSince) overSince = now;
        if (now - overSince > GOV.overMs && now - lastRaise > GOV.raiseGapMs) { raiseShed(avg, 0); lastRaise = now; overSince = 0; }
      } else {
        overSince = 0;
        if ((shedStage || shedCh.length) && canLower(avg)) {
          if (!calmSince) calmSince = now;
          if (now - calmSince > GOV.calmMs && now - lastRaise > GOV.lowerGapMs && now - lastLower > GOV.lowerGapMs) { lowerShed(); lastLower = now; calmSince = now; }
        } else calmSince = 0;
      }
    }
    function setGuard(on) {
      guardOn = on;
      $('btnGuard').textContent = 'Load guard: ' + (on ? 'On' : 'Off');
      try { localStorage.setItem('mf.guard', on ? '1' : '0'); } catch (e) {}
      if (!on && running) { shedStage = 0; const old = shedCh.slice(); shedCh = []; sendShed(); old.forEach(i => applyCh(i, enabledMask[i])); }
      overSince = calmSince = 0;
      updateShedUI();
    }

    function showLag() {
      const el = $('lagInfo');
      if (!el) return;
      const info = lagInfo[sel];
      el.textContent = info ? `• Lag: ${info.ms.toFixed(1)}ms (${(info.conf * 100).toFixed(0)}%)` : '';
    }

    function buildStrips(count) {
      const container = $('strips');
      container.innerHTML = '';
      $('count').textContent = `(${count} detected)`;
      for (let i = 0; i < count; i++) {
        if (enabledMask[i] === undefined) enabledMask[i] = true;
        const div = document.createElement('div');
        div.className = `strip ${enabledMask[i] ? 'enabled' : ''} ${i === sel ? 'sel' : ''}`;
        div.id = `strip-${i}`;
        div.innerHTML = `
          <button class="n">Ch ${i + 1}</button>
          <div class="vm">
            <div class="t in" title="Input level"><i id="m-in-${i}"></i></div>
            <div class="t gr" title="Gain reduction"><i id="m-out-${i}"></i></div>
          </div>
          <button class="sw" role="switch" aria-label="Process channel ${i + 1}" aria-checked="${enabledMask[i]}"><span></span></button>
        `;
        div.querySelector('.n').onclick = () => {
          wn.forEach((w, j) => w.port.postMessage({ type: 'sel', value: j === i }));
          sel = i; specLatest = null; gateState = null;
          document.querySelectorAll('.strip').forEach((s, j) => s.classList.toggle('sel', j === sel));
          $('selName').textContent = `Ch ${sel + 1}`;
          showLag();
        };
        const sw = div.querySelector('.sw');
        sw.onclick = () => {
          enabledMask[i] = !enabledMask[i];
          sw.setAttribute('aria-checked', enabledMask[i]);
          div.classList.toggle('enabled', enabledMask[i]);
          applyCh(i, enabledMask[i]);
          try { localStorage.setItem('mf.enabled', JSON.stringify(enabledMask)); } catch (e) {}
        };
        container.appendChild(div);
      }
    }

    /* ------------------------------------------------------------------
       Analyzers: meters, GR, DSP load, spectrum
    ------------------------------------------------------------------ */
    const tdBuf = new Float32Array(2048);
    function peak(an) {
      if (!an) return 0;
      an.getFloatTimeDomainData(tdBuf);
      let p = 0;
      for (let i = 0; i < tdBuf.length; i++) { const v = tdBuf[i] < 0 ? -tdBuf[i] : tdBuf[i]; if (v > p) p = v; }
      return p;
    }
    const lvl = v => { if (v <= 0.001) return 0; const db = 20 * Math.log10(v); return db < -60 ? 0 : db > 0 ? 1 : (db + 60) / 60; };

    const specDisp = { inp: new Float32Array(NB), cln: new Float32Array(NB), rem: new Float32Array(NB) };
    const specTgt = { inp: new Float32Array(NB), cln: new Float32Array(NB), rem: new Float32Array(NB) };
    const fBuf = new Float32Array(1024);

    function bandsFromAnalyser(an, out) {
      if (!an) { out.fill(0); return; }
      an.getFloatFrequencyData(fBuf);
      const sr = audioCtx.sampleRate, df = sr / an.fftSize, f0 = 30, f1 = Math.min(32000, sr / 2 - 100), nb = fBuf.length;
      for (let i = 0; i < NB; i++) {
        const fa = f0 * Math.pow(f1 / f0, i / NB), fb = f0 * Math.pow(f1 / f0, (i + 1) / NB);
        const ka = Math.min(nb - 1, Math.floor(fa / df)), kb = Math.min(nb - 1, Math.max(ka, Math.floor(fb / df)));
        let m = -200;
        for (let k = ka; k <= kb; k++) if (fBuf[k] > m) m = fBuf[k];
        const v = (m + 6 + 96) / 90;           // analyser dB -> same dBFS scale the worklet uses
        out[i] = v < 0 ? 0 : v > 1 ? 1 : v;
      }
    }

    function drawSpectrum(idleText) {
      const cv = $('spectrum');
      const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
      if (!W || !H) return;
      const pw = Math.round(W * dpr), ph = Math.round(H * dpr);
      if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
      const ctx = cv.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      const sr = audioCtx ? audioCtx.sampleRate : 48000, f0 = 30, f1 = Math.min(32000, sr / 2 - 100);
      const padB = 16, plotH = H - padB;
      ctx.font = '10px ui-monospace, Menlo, monospace';
      ctx.lineWidth = 1; ctx.strokeStyle = '#2C3045'; ctx.fillStyle = '#8A90AB';
      for (const db of [-20, -40, -60, -80]) {
        const y = Math.round(plotH - ((db + 96) / 90) * plotH) + 0.5;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
        ctx.fillText(db + '', 4, y - 2);
      }
      for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]) {
        if (f >= f1) continue;
        const x = Math.round((Math.log(f / f0) / Math.log(f1 / f0)) * W) + 0.5;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, plotH); ctx.stroke();
        ctx.fillText(f >= 1000 ? (f / 1000) + 'k' : f + '', x + 3, H - 3);
      }
      if (idleText) {
        ctx.fillStyle = '#8A90AB'; ctx.font = '13px ui-sans-serif, system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(idleText, W / 2, plotH / 2); ctx.textAlign = 'left';
        return;
      }
      const path = arr => {
        ctx.beginPath();
        for (let i = 0; i < NB; i++) { const x = (i / (NB - 1)) * W, y = plotH - arr[i] * plotH; if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); }
      };
      ctx.lineJoin = 'round';
      path(specDisp.inp); ctx.strokeStyle = '#8A90AB'; ctx.lineWidth = 1.25; ctx.stroke();
      path(specDisp.cln); ctx.lineTo(W, plotH); ctx.lineTo(0, plotH); ctx.closePath(); ctx.fillStyle = 'rgba(140,155,255,0.20)'; ctx.fill();
      path(specDisp.cln); ctx.strokeStyle = '#8C9BFF'; ctx.lineWidth = 1.6; ctx.stroke();
      path(specDisp.rem); ctx.strokeStyle = '#FF8F70'; ctx.lineWidth = 1.25; ctx.stroke();
    }

    function updateSpectrum(now) {
      const processed = effOn(sel);
      const fresh = specLatest && now - specLatest.t < 500;
      if (processed && fresh) {
        specTgt.inp.set(specLatest.inputSpec); specTgt.cln.set(specLatest.cleanSpec); specTgt.rem.set(specLatest.feedbackSpec);
      } else {
        // Bypassed (or worklet idle): analyse the actual signal flowing through the channel
        bandsFromAnalyser(anIn[sel], specTgt.inp);
        bandsFromAnalyser(anOut[sel], specTgt.cln);
        specTgt.rem.fill(0);
      }
      for (const k of ['inp', 'cln', 'rem']) {
        const d = specDisp[k], t = specTgt[k];
        for (let i = 0; i < NB; i++) d[i] += (t[i] - d[i]) * (t[i] > d[i] ? 0.6 : 0.2);
      }
      drawSpectrum();
    }

    function updateStatusText(now) {
      if (!effOn(sel)) { setTxt('gateInfo', shedCh.includes(sel) ? '\u2022 Load guard: direct bypass' : '\u2022 Bypass (direct input)', ''); setTxt('learnInfo', '', ''); return; }
      const fi = faderInfo[sel], fr = fi && now - fi.t < 1500 && fi.db < -0.5;
      if (gateState && now - gateState.t < 600) {
        setTxt('gateInfo', gateState.open ? '\u2022 Gate open' : '\u2022 Gate closed', gateState.open ? 'open' : '');
        if (!fr) setTxt('learnInfo', gateState.learning ? '\u2022 Gate learning' : '\u2022 Learn paused (signal present)', gateState.learning ? 'on' : '');
      } else { setTxt('gateInfo', '', ''); if (!fr) setTxt('learnInfo', '', ''); }
      if (fr) setTxt('learnInfo', '\u2022 Fader ' + fi.db.toFixed(1) + ' dB' + (fi.state === 2 ? ' (cutting)' : fi.state === 1 ? ' (returning to safe zone)' : ' (safe zone, parked)'), fi.state === 2 ? '' : 'on');
    }

    function renderHw() {
      const el = $('hwInfo');
      if (!running || !audioCtx) { setTxt('hwInfo', '', 'hw'); return; }
      const k = r => r ? (r / 1000).toFixed(r % 1000 ? 1 : 0) + ' kHz' : '?';
      const parts = ['In ' + k(hw.inRate) + (hw.inBits ? ' / ' + hw.inBits + '-bit' : ''), 'Out ' + k(hw.outRate), 'Engine ' + k(audioCtx.sampleRate)];
      const lat = (audioCtx.baseLatency || 0) + (audioCtx.outputLatency || 0);
      if (lat) parts.push((lat * 1000).toFixed(1) + ' ms out');
      if (hintLevel) parts.push('buffer: ' + HINTS[hintLevel]);
      parts.push('32-bit float');
      const mismatch = (hw.inRate && hw.outRate && hw.inRate !== hw.outRate) || (hw.outRate && audioCtx.sampleRate !== hw.outRate);
      setTxt('hwInfo', parts.join(' \u00b7 ') + (mismatch ? ' \u00b7 resampling' : ''), 'hw' + (mismatch ? ' warn' : ''));
      el.title = 'Channels: ' + hw.ch + '  |  Output routing: ' + hw.outMode + '\nThe engine runs at the input device rate; Chrome converts to the output device format.';
    }

    function housekeeping(now) {
      renderHw();
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended' || audioCtx.state === 'interrupted') audioCtx.resume().catch(() => {});
      try {
        const t = rawStream && rawStream.getAudioTracks()[0];
        const r = t && t.getSettings().sampleRate;
        if (r && hw.inRate && r !== hw.inRate) scheduleRestart('input sample rate changed to ' + r + ' Hz');
      } catch (e) {}
    }

    function meterLoop(now) {
      if (!running) return;
      now = now || performance.now();
      let sumLoad = 0;
      for (let i = 0; i < wn.length; i++) {
        const ip = peak(anIn[i]), op = peak(anOut[i]);
        const li = lvl(ip), lo = lvl(op);
        meterIn[i] = li > meterIn[i] ? li : Math.max(li, meterIn[i] - 0.03);
        let grDb = 0;
        if (effOn(i) && wired[i] && ip > 0.003) { const r = op / ip; grDb = r < 1 ? -20 * Math.log10(Math.max(r, 0.01)) : 0; }
        const tg = Math.min(1, grDb / 24);
        meterGr[i] += (tg - meterGr[i]) * (tg > meterGr[i] ? 0.5 : 0.08);
        const a = $(`m-in-${i}`), b = $(`m-out-${i}`);
        const va = meterIn[i].toFixed(3), vb = meterGr[i].toFixed(3);
        if (a && mShown['a' + i] !== va) { mShown['a' + i] = va; a.style.transform = `scaleY(${va})`; }
        if (b && mShown['b' + i] !== vb) { mShown['b' + i] = vb; b.style.transform = `scaleY(${vb})`; }
        if (loadT[i] && now - loadT[i] < 800 && wired[i]) sumLoad += load[i];
      }
      // DSP meter: whole-render-thread load from Chrome when available, else sum of per-channel timings
      let dsp = Math.min(100, sumLoad), under = 0;
      if (renderCap && now - renderCap.t < 1500) { dsp = renderCap.avg * 100; under = renderCap.under; }
      const fill = $('dsp-fill');
      fill.style.width = dsp.toFixed(1) + '%';
      fill.style.background = under > 0 ? 'var(--warm)' : dsp > 85 ? 'var(--warm)' : dsp > 65 ? 'var(--amber)' : 'var(--ok)';
      setTxt('dsp-val', dsp.toFixed(1) + '%');
      if (under > 0 && now - lastUnderLog > 5000) { lastUnderLog = now; log('Audio underrun detected (' + (under * 100).toFixed(1) + '% of blocks). Reduce active channels if clicks are audible.'); }

      if (!renderCap && now - lastGov > 250) { lastGov = now; govern(sumLoad / 100, sumLoad / 100, 0); }
      updateSpectrum(now);
      updateStatusText(now);
      if (now - lastHouse > 1000) { lastHouse = now; housekeeping(now); }
      animId = requestAnimationFrame(meterLoop);
    }

    /* ------------------------------------------------------------------
       Engine start / stop / restart
    ------------------------------------------------------------------ */
    function setBtn(live, txt) {
      const b = $('btnStart');
      b.textContent = txt || (live ? 'Stop' : 'Start');
      b.classList.toggle('live', !!live);
    }

    async function checkOutputRate() {
      if (!running) return;
      const r = await probeOutputRate(hw.outId);
      if (r && hw.outRate && r !== hw.outRate) scheduleRestart('output device rate changed to ' + r + ' Hz');
    }

    async function start() {
      if (blocked) throw new Error(blocked[0]);
      const outId = $('selOut').value;
      const inId = $('selIn').value;

      // 1. Learn the output hardware rate, then open capture preferring that rate
      const outRate = await probeOutputRate(outId);
      await openStreams(outRate);
      logMicSettings();

      const rawTrack = rawStream.getAudioTracks()[0], rs = rawTrack.getSettings();
      const mainTrack = streamMain.getAudioTracks()[0], ms = mainTrack.getSettings();
      const inRate = rs.sampleRate || 0;
      const chCount = Math.max(1, Math.min(32, rs.channelCount || 2));
      const useMain = (ms.channelCount || 1) >= chCount;
      if (!useMain) log('Processed capture has fewer channels than the raw capture; using raw audio on all channels.');

      // 2. Engine rate = input hardware rate (no resampling on capture). Chrome converts once to the output device.
      audioCtx = makeCtx(inRate || outRate, outId);
      if (outId && typeof audioCtx.setSinkId === 'function' && audioCtx.sinkId !== outId) {
        try { await audioCtx.setSinkId(outId); } catch (e) { log('Output sink error: ' + e.message); }
      }
      if (audioCtx.state !== 'running') await audioCtx.resume();

      hw = { inRate: inRate || audioCtx.sampleRate, outRate: outRate || audioCtx.sampleRate, inBits: rs.sampleSize || 0, ch: chCount, inId, outId, outMode: 'stereo' };
      if (hw.inRate === hw.outRate && audioCtx.sampleRate === hw.inRate) log('Sample rates matched at ' + hw.inRate + ' Hz: no resampling.');
      else log('Rate mismatch: input ' + hw.inRate + ' Hz, output ' + hw.outRate + ' Hz, engine ' + audioCtx.sampleRate + ' Hz. Chrome will resample once at the output.');
      log('Processing is 32-bit float internally; Chrome converts to the output device bit depth.');

      // 3. Worklet
      const blob = new Blob([workletCode], { type: 'application/javascript' });
      const url = URL.createObjectURL(blob);
      try { await audioCtx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }

      srcMain = audioCtx.createMediaStreamSource(streamMain);
      rawSource = audioCtx.createMediaStreamSource(rawStream);
      splitRaw = audioCtx.createChannelSplitter(chCount);
      splitMain = audioCtx.createChannelSplitter(chCount);
      rawSource.connect(splitRaw);
      srcMain.connect(splitMain);
      const dry = useMain ? splitMain : splitRaw;

      // 4. Output bus: 1:1 channel return when the device has enough channels
      const dest = audioCtx.destination;
      let toOut = g => g.connect(dest);
      merger = null;
      if (chCount >= 2 && dest.maxChannelCount >= chCount) {
        try {
          dest.channelCount = chCount; dest.channelCountMode = 'explicit'; dest.channelInterpretation = 'discrete';
          merger = audioCtx.createChannelMerger(chCount); merger.connect(dest);
          toOut = (g, i) => g.connect(merger, 0, i);
          hw.outMode = chCount + ' ch, 1:1';
        } catch (e) { merger = null; toOut = g => g.connect(dest); }
      } else if (chCount > 2) {
        hw.outMode = 'summed (output has ' + dest.maxChannelCount + ' ch)';
        log('Output device has only ' + dest.maxChannelCount + ' channels; channels are summed to the output.');
      }

      if (sel >= chCount) sel = 0;
      buildStrips(chCount);
      $('selName').textContent = `Ch ${sel + 1}`;
      wn = []; gP = []; gB = []; anIn = []; anOut = []; wired = []; tm = []; warmT = []; load = []; loadT = []; lagInfo = []; faderInfo = [];
      meterIn = new Array(chCount).fill(0); meterOut = new Array(chCount).fill(0); meterGr = new Array(chCount).fill(0);
      specLatest = null; gateState = null;
      shedStage = 0; shedCh = []; overSince = calmSince = 0; lastRaise = performance.now(); lastLower = 0; lowerBlockUntil = 0; underTimes = [];
      let lc = null, lcn = 0;

      for (let i = 0; i < chCount; i++) {
        const proc = new AudioWorkletNode(audioCtx, 'mf-processor', {
          numberOfInputs: 2, numberOfOutputs: 1, outputChannelCount: [1], processorOptions: { index: i }
        });
        proc.port.onmessage = e => {
          const d = e.data, t = performance.now();
          if (d.type === 'cpu') { load[i] = d.load; loadT[i] = t; }
          else if (d.type === 'stats') {
            if (i !== sel) return;
            specLatest = { inputSpec: d.inputSpec, cleanSpec: d.cleanSpec, feedbackSpec: d.feedbackSpec, t };
            if (d.learning === lc) lcn++; else { lc = d.learning; lcn = 0; }
            const prev = gateState ? gateState.learning : d.learning;
            gateState = { open: d.open, learning: (lcn >= 2 || !gateState) ? d.learning : prev, t };
          } else if (d.type === 'fader') { faderInfo[i] = { db: d.db, ceilDb: d.ceilDb, state: d.state, t }; }
          else if (d.type === 'lag') { lagInfo[i] = { ms: d.ms, conf: d.conf }; if (i === sel) showLag(); }
        };
        proc.port.postMessage({ type: 'config', ...defaultConfig });  // every channel has its own gate, per-bin gains and fader
        if (i === sel) proc.port.postMessage({ type: 'sel', value: true });

        dry.connect(proc, i, 0);          // processed-path dry input
        splitRaw.connect(proc, i, 1);     // raw reference input

        const aIn = audioCtx.createAnalyser(); aIn.fftSize = 2048; aIn.smoothingTimeConstant = 0.55;
        const aOut = audioCtx.createAnalyser(); aOut.fftSize = 2048; aOut.smoothingTimeConstant = 0.55;
        splitRaw.connect(aIn, i);

        const gainP = audioCtx.createGain(); gainP.gain.value = 0;      // processed: silent until warmed up
        const gainB = audioCtx.createGain(); gainB.gain.value = 1;      // bypass: raw direct, no worklet in path
        splitRaw.connect(gainB, i);
        toOut(gainP, i); toOut(gainB, i);
        gainP.connect(aOut); gainB.connect(aOut);

        wn.push(proc); gP.push(gainP); gB.push(gainB); anIn.push(aIn); anOut.push(aOut);
        wired.push(false); tm.push(null); warmT.push(null); load.push(0); loadT.push(0);
      }
      startT.forEach(clearTimeout); startT = []; let k = 0;
      for (let i = 0; i < chCount; i++) { const d = enabledMask[i] ? 60 * k++ : 0; startT.push(setTimeout(() => applyCh(i, !!enabledMask[i]), d)); }

      // 5. Monitoring: DSP load, underruns, device loss
      renderCap = null;
      if (audioCtx.renderCapacity) {
        try {
          const rc = audioCtx.renderCapacity;
          rc.addEventListener('update', e => { renderCap = { avg: e.averageLoad, peak: e.peakLoad, under: e.underrunRatio, t: performance.now() }; govern(e.averageLoad, e.peakLoad, e.underrunRatio); });
          rc.start({ updateInterval: 0.1 });
          renderCap = { avg: 0, peak: 0, under: 0, t: performance.now() };
          audioCtx._rc = rc;
        } catch (e) { renderCap = null; }
      }
      audioCtx.onstatechange = () => { if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {}); };
      audioCtx.addEventListener('sinkchange', () => { log('Audio output changed.'); checkOutputRate(); });
      [rawTrack, mainTrack].forEach(t => { t.onended = () => scheduleRestart('input device disconnected'); });

      running = true;
      updateShedUI();
      lastHouse = 0;
      meterLoop();
    }

    async function stop() {
      running = false;
      clearTimeout(restartTimer);
      if (animId) cancelAnimationFrame(animId);
      tm.forEach(clearTimeout); warmT.forEach(clearTimeout); startT.forEach(clearTimeout); startT = [];
      const ctx = audioCtx;
      if (ctx && ctx._rc) { try { ctx._rc.stop(); } catch (e) {} }
      renderCap = null;
      closeStreams();
      audioCtx = null;
      if (ctx) { ctx.onstatechange = null; try { await ctx.close(); } catch (e) {} }
      wn = []; gP = []; gB = []; anIn = []; anOut = []; wired = []; tm = []; warmT = []; load = []; loadT = [];
      merger = null; splitRaw = null; splitMain = null; specLatest = null; gateState = null;
      shedStage = 0; shedCh = [];
      setBtn(false);
      $('strips').innerHTML = '<p class="empty">Connect your mixer over USB, choose it above, then press Start.</p>';
      $('count').textContent = '';
      $('dsp-fill').style.width = '0%'; setTxt('dsp-val', '0.0%');
      setTxt('hwInfo', '', 'hw'); setTxt('guardInfo', guardOn ? '' : 'Guard off', 'guard'); setTxt('gateInfo', '', ''); setTxt('learnInfo', '', ''); $('lagInfo').textContent = '';
      specDisp.inp.fill(0); specDisp.cln.fill(0); specDisp.rem.fill(0);
      drawSpectrum('Press Start to see the live analyzer');
    }

    async function toggle() {
      if (busy) return;
      busy = true;
      try {
        if (running) { await stop(); log('Engine stopped.'); }
        else { setBtn(false, 'Starting...'); await start(); setBtn(true); log('Engine started successfully.'); }
      } catch (e) {
        log('Start Error: ' + e.message);
        await stop();
      } finally { busy = false; }
    }

    function scheduleRestart(reason) {
      if (!running || busy) return;
      clearTimeout(restartTimer);
      restartTimer = setTimeout(async () => {
        if (busy || !running) return;
        busy = true; log('Restarting engine: ' + reason);
        try { await stop(); await scanDevices(false); setBtn(false, 'Starting...'); await start(); setBtn(true); log('Engine restarted.'); }
        catch (e) { log('Restart failed: ' + e.message); await stop(); }
        finally { busy = false; }
      }, 300);
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (blocked) return;
      drawSpectrum('Press Start to see the live analyzer');
      if (window.ResizeObserver) new ResizeObserver(() => { if (!running) drawSpectrum('Press Start to see the live analyzer'); }).observe($('spectrum'));

      $('btnScan').onclick = () => scanDevices(true);
      $('btnStart').onclick = toggle;
      $('btnGuard').onclick = () => setGuard(!guardOn);
      $('btnGuard').textContent = 'Load guard: ' + (guardOn ? 'On' : 'Off');
      $('selIn').onchange = () => { matchOut(); if (running) scheduleRestart('input device changed'); };
      $('selOut').onchange = () => { if (running) scheduleRestart('output device changed'); };

      const setAll = on => {
        enabledMask = enabledMask.map(() => on);
        document.querySelectorAll('.strip').forEach((s, i) => {
          s.classList.toggle('enabled', on);
          s.querySelector('.sw').setAttribute('aria-checked', String(on));
          if (on) setTimeout(() => applyCh(i, true), i * 50); else applyCh(i, false);
        });
        try { localStorage.setItem('mf.enabled', JSON.stringify(enabledMask)); } catch (e) {}
      };
      $('btnAll').onclick = () => setAll(true);
      $('btnNone').onclick = () => setAll(false);

      navigator.mediaDevices.addEventListener('devicechange', async () => {
        await scanDevices(false);
        if (!running) return;
        const gone = (kind, id) => id && !devs.some(d => d.kind === kind && d.deviceId === id);
        if (gone('audioinput', hw.inId) || gone('audiooutput', hw.outId)) scheduleRestart('audio device removed');
        else checkOutputRate();
      });

      scanDevices();
    });
  </script>
</body>
</html>
